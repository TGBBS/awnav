mainSections = ["post"]
rssFullContent = true
favicon = "img/favicon.png"

SortBy = "default"

[footer]
    since = 2026
    customText = "Theme Stack designed by Jimmy · AW Blog"

[dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02"

[sidebar]
    emoji = "🧭"
    subtitle = "Google 索引、SEO 方案与 Telegram 内容增长"
    avatar = "img/avatar.png"

[article]
    headingAnchor = true
    math = false
    readingTime = true

    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 8 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 12 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle = true
    default = "auto"
